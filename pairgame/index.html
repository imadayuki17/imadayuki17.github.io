						<!-- ゲーム終了時のメッセージ -->
						<div id="game-result"></div>

					<div id="game-control">
						<div id="start">
							<button onclick="shuffle(); gameStart();">START</button>
						</div>
						<div id="timer">
							00:00
						</div>
						<div id="message">
							STAND BY...
						</div>
					</div>
				</div>
			</div>

		<script>
			// 右カラムの数字の配置ここから
			function shuffle() {
				var numbers = [];

				// 112233・・・のように64個並べる
				for (var i = 1; i <= 32; i++) {
					numbers.push(i);
					numbers.push(i);
				}

				// ランダムに2つの数字を抜き出して入れ替える
				// それを100回繰り返す
				for (var i = 0; i < 100; i++) {
					var a = Math.floor(Math.random() * 64);
					var b = Math.floor(Math.random() * 64);

					var temp = numbers[a];
					numbers[a] = numbers[b];
					numbers[b] = temp;
				}

				// box1からbox64に順番に入れる
				for (var i = 1; i <= 64; i++) {
					var box = document.getElementById("box" + i);

					// 数字を入れ替える
					box.textContent = numbers[i - 1];

					// ボックスを再表示する
					box.style.visibility = "visible";
					
					// 選択状態を解除する
					box.classList.remove("selected");
				}
				
				// 選択状態をリセット
				firstBox = null;
			}
			// 右カラムの数字の配置ここまで

			// 最初にクリックしたボックスを記憶する変数
			var firstBox = null;

			// ボックスをクリックしたときの処理
			function selectNumber(box) {

				// ゲーム開始前、またはゲームオーバーなら何もしない
				if (!gameStarted || gameOver) {
					return;
				}

				// すでに消えたボックスは何もしない
				if (box.style.visibility === "hidden") {
					return;
				}

				// 1回目のクリック
				if (firstBox === null) {
					firstBox = box;
					firstBox.classList.add("selected");
					return;
				}

				// 同じボックスを2回クリックした場合
				if (firstBox === box) {
					return;
				}

				// 1回目と2回目の数字を比較
				if (firstBox.textContent === box.textContent) {

					// 数字が同じなら、2つのボックスを非表示にする
					firstBox.style.visibility = "hidden";
					box.style.visibility = "hidden";

					// 残っている数字を確認
					checkClear();
				}

				// 選択状態をリセット
				firstBox = null;
			}

			// すべての数字が消えたか確認
			function checkClear() {

				// 表示されているボックスの数
				var remaining = 0;

				// box1からbox64まで確認
				for (var i = 1; i <= 64; i++) {
					var box = document.getElementById("box" + i);

					// 表示されているボックスを数える
					if (box.style.visibility !== "hidden") {
						remaining++;
					}
				}

				// すべての数字が消えていたら
				if (remaining === 0) {

					// ゲーム終了
					gameOver = true;

					// タイマーとライフゲージを停止
					clearInterval(timerId);
					clearInterval(lifeGaugeTimer);

					// 下部のメッセージを非表示にする
					document.getElementById("message").textContent = "";

					// 中央にCLEAR!!を表示
					document.getElementById("game-result").textContent = "CLEAR!!";
					document.getElementById("game-result").style.display = "flex";
				}
			}

			// タイマーの設定
			var t = 0
			var timerId = 0;
			
			// ライフゲージの設定
			var lifeGaugeIndex = 1;
			var lifeGaugeTimer = null;
			
			// ゲームオーバーの設定
			var gameOver = false;
			
			// ゲーム開始状態の設定
			var gameStarted = false;

			function gameStart() {

				// ゲームオーバーを解除
				gameOver = false;

				// ゲーム開始状態にする
				gameStarted = true;
				
				// すでに動いているタイマーを停止
				clearInterval(timerId);
				clearInterval(lifeGaugeTimer);

				// カウントを0にリセット
				t = 0;

				// 画面表示も00:00に戻す
				document.getElementById("timer").textContent = "00:00";
				
				// メッセージを表示
				document.getElementById("message").textContent = "FIGHT!!";
				document.getElementById("game-result").style.display = "none";
				
				// ライフゲージをすべて再表示
				lifeGaugeIndex = 1;
				showAllLife();

				// タイマーを開始
				timerId = setInterval(showTime, 1000);
				
				// 1秒ごとにライフゲージを減らす
				lifeGaugeTimer = setInterval(hideLifeGauge, 1000);
			}

			// 経過時間の表示
			function showTime() {
				t++;

				// 分を計算
				var minutes = Math.floor(t / 60);

				// 秒を計算
				var seconds = t % 60;

				// 00:00形式にする
				var time =
					String(minutes).padStart(2, "0") + ":" +
					String(seconds).padStart(2, "0");

				document.getElementById("timer").innerHTML = time;
			}
			
			// ライフゲージを非表示にする
			function hideLifeGauge() {

				// 対象のライフゲージを取得
				var gauge = document.getElementById("life-gauge" + lifeGaugeIndex);

				// 非表示にする
				gauge.style.visibility = "hidden";

				// 次の番号へ
				lifeGaugeIndex++;

				// 残りのライフゲージ数を計算
				var remaining = 16 - lifeGaugeIndex;

				// 残り5個以下なら赤色
				if (remaining <= 5) {
					for (var i = lifeGaugeIndex; i <= 15; i++) {
						document.getElementById("life-gauge" + i).classList.add("red");
					}
				}

				// 残り10個以下なら黄色
				else if (remaining <= 10) {
					for (var i = lifeGaugeIndex; i <= 15; i++) {
						document.getElementById("life-gauge" + i).classList.add("yellow");
					}
				}

				// 15個すべて非表示になったら
				if (lifeGaugeIndex > 15) {

					// ゲームオーバーにする
					gameOver = true;

					// タイマーを停止
					clearInterval(timerId);
					clearInterval(lifeGaugeTimer);

					// 下部のメッセージを非表示にする
					document.getElementById("message").textContent = "";

					// 中央にGAME OVERを表示
					document.getElementById("game-result").textContent = "GAME OVER";
					document.getElementById("game-result").style.display = "flex";
				}
			}

			function fullLife() {

				// ゲーム終了後は何もしない
				if (gameOver) {
					return;
				}

				// ゲージをすべて再表示
				showAllLife();

				// 次は1番目から減らす
				lifeGaugeIndex = 1;

				// メッセージをFIGHT!!に戻す
				document.getElementById("message").textContent = "FIGHT!!";

				// 1秒後から再び減らし始める
				clearInterval(lifeGaugeTimer);
				lifeGaugeTimer = setInterval(hideLifeGauge, 1000);
			}

			// すべてのライフゲージを再表示
			function showAllLife() {
				for (var i = 1; i <= 15; i++) {
					var gauge = document.getElementById("life-gauge" + i);

					// ゲージを再表示
					gauge.style.visibility = "visible";

					// 色を初期状態（水色）に戻す
					gauge.classList.remove("yellow");
					gauge.classList.remove("red");
				}
			}
		</script>
